# ONLYOFFICE 离线协同 —— 统一入口反向代理
# /            -> nextcloud 主程序(用户/文件/共享/回收站)
# /ds-vpath/   -> documentserver(编辑器静态资源、转换 API、协同 websocket)
# 说明: DS 以子路径对外时，靠 X-Forwarded-Host 携带 /ds-vpath 前缀，让 DS 生成
#       正确的编辑器资源绝对地址(ONLYOFFICE 官方 ds-vpath 方案)。
# 注意: 协同 websocket 依赖 Upgrade/Connection 头，这两处不能删；
#       proxy_read_timeout 必须放宽，否则协同长连接被掐导致"光标不动/同步失效"。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1g;
    client_body_timeout 300s;

    # gzip 压缩静态资源(含反代响应)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # Nextcloud 主程序
    location / {
        proxy_pass http://nextcloud:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ONLYOFFICE DocumentServer(协同编辑内核)
    location /ds-vpath/ {
        rewrite ^/ds-vpath/(.*)$ /$1 break;
        proxy_pass http://documentserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host/ds-vpath;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 1g;
    }
}
