version: '2.4'

# ONLYOFFICE 在线协同编辑离线部署编排(镜像均来自随包 images/*.tar，导入后无需任何外网)
# 架构: nginx(唯一入口) -> nextcloud(用户/文件/共享) + documentserver(docx/xlsx 协同内核)
# 协同链路: 浏览器 --websocket--> nginx /ds-vpath/ --> documentserver
# 版本 pin: workflow env 与 env.example 的 DS_VERSION/NC_VERSION 需保持一致

services:
  docs-db:
    image: postgres:15.4-alpine
    restart: always
    expose:
      - '5432'
    volumes:
      - docs-db:/var/lib/postgresql/data:rw
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - POSTGRES_DB=${POSTGRES_DB:?请在 .env 中设置}
      - POSTGRES_USER=${POSTGRES_USER:?请在 .env 中设置}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置}
    networks:
      - office
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3

  docs-cache:
    image: redis:7.2.4-alpine
    restart: always
    expose:
      - '6379'
    volumes:
      - docs-cache:/data:rw
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置}
    networks:
      - office
    mem_limit: 256m
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?请在 .env 中设置}"
    healthcheck:
      test: ['CMD-SHELL', "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  documentserver:
    image: documentserver:${DS_VERSION:?请在 .env 中设置 DS_VERSION}
    restart: always
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置}
    volumes:
      - docs-data:/var/www/onlyoffice/Data:rw
      - docs-lib:/var/lib/onlyoffice:rw
      - docs-log:/var/log/onlyoffice:rw
      # 麒麟公文字体只读挂载(宿主机没有 winfonts 目录时 docker 会自动建空目录)
      - /usr/share/fonts/winfonts:/usr/share/fonts/winfonts:ro
      - /usr/share/fonts:/usr/share/fonts/kylin:ro
      # 追加字体放这里(容器内为 /usr/share/fonts/custom)，重启容器生效
      - ./data/fonts:/usr/share/fonts/custom:rw
    networks:
      - office
    # 麒麟 V10 + 老版本 docker(20.10.x) 的默认 seccomp 会拦截 documentserver 容器内
    # 自带 PostgreSQL/RabbitMQ 所需系统调用导致反复重启(ONLYOFFICE 官方麒麟指南同款
    # 问题，官方解法即放开 seccomp 或升级 docker >= 23)。离线内网环境风险可控。
    security_opt:
      - seccomp=unconfined
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 10

  nextcloud:
    image: nextcloud:${NC_VERSION:?请在 .env 中设置 NC_VERSION}
    restart: always
    volumes:
      - nextcloud:/var/www/html:rw
      - ./data/nextcloud-data:/var/www/html/data:rw
      - ./data/custom-apps:/var/www/html/custom_apps:rw
    environment:
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - POSTGRES_HOST=docs-db
      - POSTGRES_DB=${POSTGRES_DB:?请在 .env 中设置}
      - POSTGRES_USER=${POSTGRES_USER:?请在 .env 中设置}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置}
      - REDIS_HOST=docs-cache
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD:?请在 .env 中设置}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?请在 .env 中设置}
      # SERVER_IP 为浏览器访问的内网 IP；nextcloud/localhost 供容器间互访
      - NEXTCLOUD_TRUSTED_DOMAINS=${SERVER_IP:?请在 .env 中设置 SERVER_IP} nextcloud localhost
      - TRUSTED_PROXIES=172.16.0.0/12
      - OVERWRITEPROTOCOL=http
      - OVERWRITECLIURL=http://${SERVER_IP:?请在 .env 中设置 SERVER_IP}
      - PHP_UPLOAD_LIMIT=1g
      - PHP_MEMORY_LIMIT=512m
    networks:
      - office
    mem_limit: 2g
    depends_on:
      docs-db:
        condition: service_healthy
      docs-cache:
        condition: service_healthy

  nextcloud-cron:
    image: nextcloud:${NC_VERSION:?请在 .env 中设置 NC_VERSION}
    restart: always
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html:rw
      - ./data/nextcloud-data:/var/www/html/data:rw
      - ./data/custom-apps:/var/www/html/custom_apps:rw
    networks:
      - office
    mem_limit: 512m
    depends_on:
      - nextcloud

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - office
    mem_limit: 256m
    depends_on:
      - nextcloud
      - documentserver

networks:
  office:
    name: onlyoffice-network
    driver: bridge

volumes:
  docs-db: {}
  docs-cache: {}
  docs-data: {}
  docs-lib: {}
  docs-log: {}
  nextcloud: {}
