name: Build Teable arm64 offline bundle (Kylin V10 SP1)

# 在 GitHub 原生 arm64 runner 上拉取 teable 官方 arm64 镜像 + postgres/redis，
# 打成离线部署包(镜像 tar + compose + 安装脚本)，发布到 Releases 供离线麒麟物理机导入。
on:
  workflow_dispatch:
    inputs:
      teable_build:
        description: 'teable-community 构建号(阿里云源 tag，不含 -arm64 后缀，如 1.10.0-build.1141)'
        required: false
        default: '1.10.0-build.1141'
      publish_release:
        description: '发布到 GitHub Releases'
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths: ['.github/workflows/build.yaml', 'bundle/**']

permissions:
  contents: write

env:
  # teable 官方 CI 推送的公开镜像源(经核实为官方 CI 输出，tag 形如 X.Y.Z-build.N-arm64)
  MIRROR: registry.cn-shenzhen.aliyuncs.com/teable/teable-community
  # postgres/redis 用 Docker Hub 官方多架构镜像，runner 上直接拉 arm64
  # 注意：这两个版本与 bundle/docker-compose.yml 中的 pin 需保持一致
  POSTGRES_IMAGE: postgres:15.4-alpine
  REDIS_IMAGE: redis:7.2.4-alpine

jobs:
  pack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        env:
          INPUT_BUILD: ${{ inputs.teable_build }}
        run: |
          set -euo pipefail
          BUILD="${INPUT_BUILD:-1.10.0-build.1141}"
          echo "$BUILD" | grep -qE '^[A-Za-z0-9._-]+$' || { echo "非法 tag: $BUILD" >&2; exit 1; }
          APP_VERSION="${BUILD%%-build*}"
          {
            echo "build=$BUILD"
            echo "app_version=$APP_VERSION"
            echo "release_tag=v${APP_VERSION}-arm64"
          } >> "$GITHUB_OUTPUT"
          echo "teable 构建号: $BUILD (应用版本 $APP_VERSION)"

      - name: Pull arm64 images
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          TEABLE_SRC="${MIRROR}:${BUILD}-arm64"
          pull() {
            for i in 1 2 3; do
              docker pull --platform linux/arm64 "$1" && return 0
              echo "pull 失败，重试 $i/3: $1"
              sleep 15
            done
            echo "pull 最终失败: $1" >&2
            exit 1
          }
          pull "$TEABLE_SRC"
          pull "$POSTGRES_IMAGE"
          pull "$REDIS_IMAGE"

      - name: Verify architectures are arm64
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          TEABLE_SRC="${MIRROR}:${BUILD}-arm64"
          fail=0
          for img in "$TEABLE_SRC" "$POSTGRES_IMAGE" "$REDIS_IMAGE"; do
            arch=$(docker image inspect --format '{{.Architecture}}' "$img")
            echo "$img -> $arch"
            [ "$arch" = "arm64" ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "存在非 arm64 镜像，终止打包" >&2; exit 1; }

      - name: Retag and save images tar
        env:
          BUILD: ${{ steps.ver.outputs.build }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          set -euo pipefail
          TEABLE_SRC="${MIRROR}:${BUILD}-arm64"
          APP="teable:${APP_VERSION}"
          docker tag "$TEABLE_SRC" "$APP"
          mkdir -p dist/teable-offline/images
          docker save "$APP" "$POSTGRES_IMAGE" "$REDIS_IMAGE" \
            -o dist/teable-offline/images/teable-offline-images-arm64.tar
          du -h dist/teable-offline/images/teable-offline-images-arm64.tar
          # 载荷自检：tar 里必须有 manifest.json(避免打出空包)
          tar -tf dist/teable-offline/images/teable-offline-images-arm64.tar > /tmp/tar-list.txt
          grep -q manifest.json /tmp/tar-list.txt

      - name: Assemble offline bundle
        env:
          BUILD: ${{ steps.ver.outputs.build }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          set -euo pipefail
          B=dist/teable-offline
          cp bundle/docker-compose.yml bundle/env.example bundle/install.sh \
             bundle/uninstall.sh bundle/README.txt "$B/"
          chmod +x "$B"/*.sh
          cat > "$B/MANIFEST.txt" <<EOF
          组件版本与来源(构建于 $(date -u +%Y-%m-%dT%H:%M:%SZ)):
            teable     ${APP_VERSION}   source: ${MIRROR}:${BUILD}-arm64
            postgres   ${POSTGRES_IMAGE}
            redis      ${REDIS_IMAGE}
          目标环境: 银河麒麟 V10 SP1 / UOS 同血脉 / aarch64 / 内核 4.19+
          EOF
          docker image inspect --format '{{index .RepoDigests 0}}' \
            "teable:${APP_VERSION}" "$POSTGRES_IMAGE" "$REDIS_IMAGE" >> "$B/MANIFEST.txt" || true
          ASSET="teable-offline-arm64-${APP_VERSION}.tar.gz"
          tar -czf "dist/${ASSET}" -C dist teable-offline
          sha256sum "dist/${ASSET}" | tee dist/SHA256SUMS.txt
          du -h "dist/${ASSET}"
          echo "asset=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teable-offline-arm64-${{ steps.ver.outputs.app_version }}
          path: |
            dist/${{ env.asset }}
            dist/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.release_tag }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          ASSET="teable-offline-arm64-${APP_VERSION}.tar.gz"
          {
            echo "## 银河麒麟 V10 SP1 (aarch64) 离线部署包"
            echo
            echo "| 组件 | 版本 |"
            echo "|---|---|"
            echo "| teable | ${APP_VERSION} (源: ${MIRROR}:${BUILD}-arm64) |"
            echo "| postgres | ${POSTGRES_IMAGE} |"
            echo "| redis | ${REDIS_IMAGE} |"
            echo
            echo "目标环境: 银河麒麟 V10 SP1 / aarch64 / 内核 4.19+，Docker 20.10+ 与 Compose V2。"
            echo
            echo "部署: 解压后进入 teable-offline 目录执行 bash install.sh，访问 http://<内网IP>:3000 。"
            echo "详细步骤见包内 README.txt 与仓库 README.md。"
          } > dist/RELEASE_NOTES.md
          for i in 1 2 3; do
            if gh release create "$TAG" "dist/${ASSET}" dist/SHA256SUMS.txt \
                --title "Teable ${APP_VERSION} arm64 离线部署包 (Kylin V10 SP1)" \
                --notes-file dist/RELEASE_NOTES.md --target "$GITHUB_SHA"; then
              exit 0
            fi
            echo "release create 失败，重试 $i/3"
            sleep 10
          done
          # tag 已存在等情况：改为追加覆盖上传资产
          gh release upload "$TAG" "dist/${ASSET}" dist/SHA256SUMS.txt --clobber
