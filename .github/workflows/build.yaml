name: Build Teable arm64 bundle (Kylin V10 SP1 glibc2.31 compatible)
on:
  workflow_dispatch: #手动触发，点一下就跑
jobs:
  pack:
    runs-on: ubuntu-24.04-arm #原生arm64 runner，仅打包，不编译
    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull arm64 images (glibc2.31兼容版本锁定)
        run: |
          docker pull --platform linux/arm64 registry.cn-shenzhen.aliyuncs.com/teable/teable-community:0.12.0
          docker pull --platform linux/arm64 postgres:15-alpine
          docker pull --platform linux/arm64 redis:7-alpine
          docker inspect registry.cn-shenzhen.aliyuncs.com/teable/teable-community:0.12.0 | grep Architecture

      - name: Save tar bundle
        run: |
          docker save \
          registry.cn-shenzhen.aliyuncs.com/teable/teable-community:0.12.0 \
          postgres:15-alpine \
          redis:7-alpine \
          -o teable-arm64-bundle.tar

      - name: Upload tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: teable-arm64-bundle
          path: teable-arm64-bundle.tar
          retention-days: 7
